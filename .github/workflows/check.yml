name: Check Module

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      prove_accept_recovery:
        description: Verify accept recovery and registration replacement mutations
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  module:
    if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Check Formatting
        run: test -z "$(gofmt -l .)"
      - name: Test Module
        run: go test -race ./...
      - name: Prove Accept Recovery
        if: ${{ inputs.prove_accept_recovery }}
        run: python3 .github/scripts/verify_accept_recovery.py
      - name: Vet Module
        run: go vet ./...
      - name: Build Caddy
        run: docker build .
