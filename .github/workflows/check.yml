name: Check Module

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      prove_publication:
        type: boolean
        default: false
        description: Prove shutdown publication regression and restore source

permissions:
  contents: read

jobs:
  module:
    if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Check Formatting
        run: test -z "$(gofmt -l .)"
      - name: Test Module
        run: go test -race ./...
      - name: Prove Publication Regression
        if: ${{ inputs.prove_publication }}
        run: python3 .github/prove-publication.py
      - name: Vet Module
        run: go vet ./...
      - name: Build Caddy
        run: docker build .
